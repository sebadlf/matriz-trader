# Sirve el build estático y hace proxy de /api/ al backend: mismo origen, sin CORS (AC-31, AC-43).
server {
  listen 80;
  root /usr/share/nginx/html;

  # Healthcheck de Compose: no depende del backend.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # `/api/health` → `http://backend:8000/health` (la barra final quita el prefijo).
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fallback de SPA para las rutas de React Router.
  location / {
    try_files $uri /index.html;
  }
}
