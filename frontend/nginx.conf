# Servidor de producción del frontend: sirve el build estático y hace proxy de /api al backend.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Resolución lazy del upstream (DNS interno de Docker): nginx arranca aunque el
    # host `backend` no exista todavía; /api responde 502 hasta que el backend esté arriba (AC-31).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets con hash de Vite: cache largo.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: React Router resuelve las rutas del cliente (incluida la 404).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
