# Configuración de Alembic (migraciones de PostgreSQL). Se ejecuta desde backend/:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "descripcion"
#   uv run alembic check
#
# Sin `sqlalchemy.url`: migrations/env.py toma la URL de `Settings` (DATABASE_URL del .env de la
# raíz). Solo los tests la fijan por código, con `Config.set_main_option("sqlalchemy.url", ...)`.

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = %(here)s
path_separator = os
# Fechas de los archivos de migración en UTC (zoneinfo de la stdlib).
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
