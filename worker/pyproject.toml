[project]
name = "matriz-worker"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matriz-model",
    "matriz-broker",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "market-data-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv.sources]
matriz-model = { workspace = true }
matriz-broker = { workspace = true }
market-data-client = { git = "https://github.com/gravity-quant/market-libs.git", subdirectory = "packages/market-data-client", rev = "market-data-client-v0.7.1" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
