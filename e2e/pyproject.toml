[project]
name = "matriz-e2e"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pytest>=8.4", "pytest-playwright>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
