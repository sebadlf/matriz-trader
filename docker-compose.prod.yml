# Modo producción: PostgreSQL + backend (imagen prod, sin dependencias de desarrollo)
# + frontend (nginx sirviendo el build y haciendo proxy de /api al backend).
#
#   docker compose -f docker-compose.prod.yml up -d --build            # todo
#   docker compose -f docker-compose.prod.yml up -d --build backend    # db + backend
#   docker compose -f docker-compose.prod.yml up -d --build frontend   # solo frontend (nginx)
#
# Requiere el `.env` de la raíz (`cp .env.example .env`) y un ssh-agent con la clave
# de gravity-quant/market-libs cargada (`ssh-add`) para construir el backend.
name: matriz-trader-prod

x-root-env: &root-env
  # El .env es opcional acá: si falta, los guards `:?` de abajo cortan con el mensaje (AC-33).
  env_file:
    - path: .env
      required: false

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta .env en la raíz. Ejecutá cp .env.example .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta .env en la raíz. Ejecutá cp .env.example .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta .env en la raíz. Ejecutá cp .env.example .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *root-env
    build:
      context: ./backend
      target: prod
      ssh:
        - default
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PROD_PORT:-8080}:8080"
    # Sin depends_on: `up frontend` no levanta el backend; nginx resuelve `backend` de
    # forma lazy y responde 502 en /api hasta que exista (AC-31).

volumes:
  # Volumen con nombre: matriz-trader-prod_pgdata (AC-32).
  pgdata: {}
