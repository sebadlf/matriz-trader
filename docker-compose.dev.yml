# Modo desarrollo: PostgreSQL + backend con --reload + frontend con `vp dev` (HMR).
#
#   docker compose -f docker-compose.dev.yml up -d --build            # todo
#   docker compose -f docker-compose.dev.yml up -d --build backend    # db + backend
#   docker compose -f docker-compose.dev.yml up -d --build frontend   # solo frontend
#
# Requiere el `.env` de la raíz (`cp .env.example .env`) y un ssh-agent con la clave
# de gravity-quant/market-libs cargada (`ssh-add`) para construir el backend.
name: matriz-trader-dev

x-root-env: &root-env
  # El .env es opcional acá: si falta, los guards `:?` de abajo cortan con el mensaje (AC-33).
  env_file:
    - path: .env
      required: false

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta .env en la raíz. Ejecutá cp .env.example .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta .env en la raíz. Ejecutá cp .env.example .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta .env en la raíz. Ejecutá cp .env.example .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *root-env
    build:
      context: ./backend
      target: dev
      ssh:
        - default
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
    volumes:
      # Código montado: uvicorn --reload detecta los cambios en backend/app (AC-29).
      - ./backend/app:/app/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    <<: *root-env
    build:
      context: ./frontend
      target: dev
    environment:
      # El proxy /api del dev server de Vite apunta al servicio backend de compose.
      BACKEND_URL: http://backend:8000
    volumes:
      # Código montado para HMR; node_modules queda en un volumen anónimo con el de la imagen.
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    # Sin depends_on: `up frontend` no levanta el backend (AC-31).

volumes:
  # Volumen con nombre: matriz-trader-dev_pgdata (AC-32).
  pgdata: {}
